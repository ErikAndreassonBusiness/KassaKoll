{% extends "base.html" %} {% block title %}Logga in - KassaKoll{% endblock %} {%
block content %}
<div class="container d-flex justify-content-center align-items-center vh-100">
  <div
    class="card shadow-sm p-5 text-center"
    style="max-width: 400px; border-radius: 12px"
  >
    <h1 class="mb-3 fw-bold">KassaKoll</h1>
    <p class="text-muted mb-4">
      Simulera ditt kassaflöde och säkerställ att du alltid är redo för
      löneutbetalningar.
    </p>

    <!-- This link will eventually point to your FastAPI route that triggers the Fortnox OAuth URL -->
    <a href="/auth/fortnox/login" class="btn btn-fortnox btn-lg w-100 fw-bold">
      Log in with Fortnox
    </a>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', path='/js/login.js') }}"></script>
<script src="{{ url_for('static', path='/js/api.js') }}"></script>
{% endblock %}
